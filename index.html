<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
        <link rel="manifest" href="/site.webmanifest">
        <title> Lê Văn Bảo Thọ </title>
    </head>
    <body>
        <div class="app">
            <div class="card mg-10">
                <div class="card__title">
                    <div class="card__title--img">
                        <img src="./258397322_323778779185226_5346891099503724454_n (1).png" alt="Ảnh đại diện">
                    </div>
                    <div class="card__title--name">
                        <h1> Lê Văn Bảo Thọ </h1>
                        <div class="veri__check">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                    <div class="card__title--description">
                        <p>Profile by Lê Văn Bảo Thọ</p>
                    </div>
                </div>

                <div class="card__body mt-10">
                    <div class="row">
                        <div class="col col-lg-3 mt-10">
                            <div class="card__item">
                                <a href="https://www.facebook.com/ProFile.btho" target="_blank" class="card__link">
                                    <div class="link__icon"><i class="fab fa-facebook"></i></div>
                                </a>
                            </div>
                        </div>
                        <div class="col col-lg-3 mt-10">
                            <div class="card__item">
                                <a href="https://www.instagram.com/abo_/" target="_blank" class="card__link">
                                    <div class="link__icon"><i class="fab fa-instagram"></i></div>
                                </a>
                            </div>
                        </div>
                        <div class="col col-lg-3 mt-10">
                            <div class="card__item">
                                <a href="https://www.tiktok.com/@deptraivicoem?is_from_webapp=1&sender_device=pc" target="_blank" class="card__link">
                                    <div class="link__icon"><i class="fab fa-tiktok"></i></div>
                                </a>
                            </div>
                        </div>
                        <div class="col col-lg-3 mt-10">
                            <div class="card__item">
                                <a href="https://github.com/levanbaotho2752007" target="_blank" class="card__link">
                                    <div class="link__icon"><i class="fab fa-github"></i></div>
                                </a>
                            </div>
                        </div>
                        <div class="col col-lg-3 mt-10">
                            <div class="card__item">
                                <a href="https://twitter.com/baotho_yt" class="card__link">
                                    <div class="link__icon"><i class="fab fa-twitter"></i></div>
                                </a>
                            </div>
                        </div>                        
                    </div>
                </div>

                <div class="qr-section mt-20" style="text-align:center; color:blue;">
                    <h3>Báo cáo về dự án đã làm</h3>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?data=https://github.com/levanbaotho2752007/levanbaotho2752007.github.io/blob/main/BaocaoMach_Dtcs.docx&size=200x200" 
                         alt="QR BaocaoMach_Dtcs">
                </div>

                <div class="toggle toggle__back">
                    <a href="https://levanbaotho2752007.github.io/"><i class="fas fa-arrow-left"></i></a>
                </div>
                <div class="toggle toggle__theme">
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
